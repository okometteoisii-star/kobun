<script>
const T={
yodan:{n:"四段",e:"ア・イ・ウ・エ の4段にわたって活用。未然形に「ず」が付くとア段になる。"},
kami1:{n:"上一段",e:"イ段の1段だけで活用。「ひいきにみゐる」で覚える:干る・射る・着る・似る/煮る・見る・居る/率る(+用ゐる)。"},
shimo1:{n:"下一段",e:"エ段の1段だけで活用。古文では「蹴る」ただ1語。"},
kami2:{n:"上二段",e:"ウ段とイ段の2段で活用。未然形に「ず」が付くとイ段になる。"},
shimo2:{n:"下二段",e:"ウ段とエ段の2段で活用。未然形に「ず」が付くとエ段になる。"},
ka:{n:"カ変",e:"「来(く)」1語だけ(複合語を含む)。こ・き・く・くる・くれ・こ(こよ)。"},
sa:{n:"サ変",e:"「す・おはす」と、「〜す・〜ず」の複合動詞。せ・し・す・する・すれ・せよ。"},
na:{n:"ナ変",e:"「死ぬ・往ぬ(去ぬ)」の2語だけ。な・に・ぬ・ぬる・ぬれ・ね。"},
ra:{n:"ラ変",e:"「あり・をり・はべり・いまそかり」の4語だけ。終止形が「り」で終わる。"},
ku:{n:"ク活用",e:"連用形が「〜く」の形(〜くなる)。補助活用(カリ活用)は「く+あり」が縮まったもので、から・かり・かる・かれ。助動詞に続くときに使う。"},
siku:{n:"シク活用",e:"連用形が「〜しく」の形(〜しくなる)。補助活用(シカリ活用)は「しく+あり」が縮まったもので、しから・しかり・しかる・しかれ。助動詞に続くときに使う。"}};
const V=["yodan","kami1","shimo1","kami2","shimo2","ka","sa","na","ra"],A=["ku","siku"];
const raw={
yodan:"書く|かく,行く|ゆく,読む|よむ,飛ぶ|とぶ,思ふ|おもふ,言ふ|いふ,立つ|たつ,取る|とる,咲く|さく,歩く|あるく",
kami1:"見る|みる,着る|きる,似る|にる,煮る|にる,干る|ひる,射る|いる,居る|ゐる,率る|ゐる,用ゐる|もちゐる",
shimo1:"蹴る|ける",
kami2:"起く|おく,過ぐ|すぐ,落つ|おつ,恋ふ|こふ,悔ゆ|くゆ,老ゆ|おゆ,恥づ|はづ,閉づ|とづ,尽く|つく",
shimo2:"受く|うく,捨つ|すつ,出づ|いづ,得|う,寝|ぬ,経|ふ,見ゆ|みゆ,聞こゆ|きこゆ,答ふ|こたふ,教ふ|をしふ,求む|もとむ",
ka:"来|く,出で来|いでく,持て来|もてく",
sa:"す|す,おはす|おはす,念ず|ねんず,愛す|あいす,具す|ぐす,奏す|そうす",
na:"死ぬ|しぬ,往ぬ|いぬ,去ぬ|いぬ",
ra:"あり|あり,をり|をり,はべり|はべり,いまそかり|いまそかり",
ku:"高し|たかし,長し|ながし,白し|しろし,良し|よし,遠し|とほし,多し|おほし,無し|なし,古し|ふるし,めでたし|めでたし",
siku:"美し|うつくし,悪し|あし,悲し|かなし,をかし|をかし,恋し|こひし,嬉し|うれし,楽し|たのし,苦し|くるし,わびし|わびし,恐ろし|おそろし,珍し|めづらし"};
const Q=[];for(const k in raw)raw[k].split(",").forEach(s=>{const[w,r]=s.split("|");Q.push({w,r,t:k,adj:A.includes(k)})});

const FI=[0,1,3,5];let ai=0;
Q.filter(q=>q.adj).forEach(b=>{const f=FI[ai++%4],s=b.w.slice(0,-1),r=b.r.slice(0,-1),m=b.t==="ku"?"":"し",x=["から","かり","","かる","","かれ"][f];Q.push({w:s+m+x,r:r+m+x,t:b.t,adj:true,k:true,f,b})});
const app=document.getElementById("app"),KEY="kobun_katsuyo_v1";let mem=null,cfg={n:10,scope:"all",mode:"mix"},S=null;
const load=()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return j}catch(e){}return mem||{last:"",streak:0,best:0,days:[],done:0,ok:0}};
let dbRef=null,wT=null;
const save=d=>{mem=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}push()};
function push(){if(!dbRef)return;clearTimeout(wT);wT=setTimeout(()=>{dbRef.set(mem).catch(()=>{})},400)}
function merge(l,r){const b=(r.last>l.last||(r.last===l.last&&r.streak>=l.streak))?r:l,m=r.done>l.done?r:l;
 return{last:b.last,streak:b.streak,best:Math.max(l.best||0,r.best||0,b.streak),days:[...new Set([...(l.days||[]),...(r.days||[])])].sort().slice(-60),done:m.done,ok:m.ok}}
let stOK=true;try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){stOK=false}
const dobj=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayOff=n=>ymd(dobj(n));
const curStreak=d=>d.last===dayOff(0)||d.last===dayOff(-1)?d.streak:0;
const G={く:"かきくけ",ぐ:"がぎぐげ",す:"さしすせ",つ:"たちつて",づ:"だぢづで",ぬ:"なにぬね",ふ:"はひふへ",ぶ:"ばびぶべ",む:"まみむめ",ゆ:"やいゆえ",る:"らりるれ"};
const SP={得:["え","え","う","うる","うれ","えよ"],寝:["ね","ね","ぬ","ぬる","ぬれ","ねよ"],経:["へ","へ","ふ","ふる","ふれ","へよ"]};
function conj(q){
 const o=q.b||q,w=o.w,t=q.t,s=w.slice(0,-1),e=w.slice(-1),g=G[e];
 if(SP[w])return SP[w];
 if(t==="yodan"&&g)return[s+g[0],s+g[1],w,w,s+g[3],s+g[3]];
 if(t==="kami2"&&g)return[s+g[1],s+g[1],w,w+"る",w+"れ",s+g[1]+"よ"];
 if(t==="shimo2"&&g)return[s+g[3],s+g[3],w,w+"る",w+"れ",s+g[3]+"よ"];
 if(t==="kami1"||t==="shimo1")return[s,s,w,w,s+"れ",s+"よ"];
 if(t==="ka"){const b=o.r.slice(0,-1);return[b+"こ",b+"き",b+"く",b+"くる",b+"くれ",b+"こ(こよ)"]}
 if(t==="sa")return e==="ず"?[s+"ぜ",s+"じ",w,w+"る",w+"れ",s+"ぜよ"]:[s+"せ",s+"し",w,s+"する",s+"すれ",s+"せよ"];
 if(t==="na")return[s+"な",s+"に",w,s+"ぬる",s+"ぬれ",s+"ね"];
 if(t==="ra")return[s+"ら",s+"り",w,s+"る",s+"れ",s+"れ"];
 if(t==="ku")return[s+"く",s+"く",w,s+"き",s+"けれ","○"];
 if(t==="siku")return[s+"しく",s+"しく",w,s+"しき",s+"しけれ","○"];
 return null;
}
const L=["未然","連用","終止","連体","已然","命令"];
const grid=(c,hit)=>`<div class="cj">${L.map((l,i)=>`<div class="${hit===i?"hit":""}"><b>${l}</b><span>${c[i]}</span></div>`).join("")}</div>`;
function cjHtml(q){
 const c=conj(q);if(!c)return"";if(!q.adj)return grid(c,q.m?q.fi:-1);
 const o=q.b||q,s=o.w.slice(0,-1),m=q.t==="ku"?"":"し",k=["から","かり","○","かる","○","かれ"].map(x=>x==="○"?x:s+m+x);
 return`<div class="rl">本活用</div>${grid(c,q.m&&!q.kari?q.fi:-1)}<div class="rl">カリ活用</div>${grid(k,q.k?q.f:q.m&&q.kari?q.fi:-1)}`}
const AX={
tsu:{n:"つ",f:["て","て","つ","つる","つれ","てよ"],t:"下二段型",c:"連用形",m:"完了・強意"},
nu:{n:"ぬ",f:["な","に","ぬ","ぬる","ぬれ","ね"],t:"ナ変型",c:"連用形",m:"完了・強意"},
ki:{n:"き",f:["(せ)","○","き","し","しか","○"],t:"特殊型",c:"連用形(カ変・サ変は未然形にも)",m:"過去"},
ke:{n:"けり",f:["(けら)","○","けり","ける","けれ","○"],t:"ラ変型",c:"連用形",m:"過去・詠嘆"},
ta:{n:"たり",f:["たら","たり","たり","たる","たれ","たれ"],t:"ラ変型",c:"連用形",m:"完了・存続"},
ri:{n:"り",f:["ら","り","り","る","れ","れ"],t:"ラ変型",c:"サ変の未然形・四段の已然形",m:"完了・存続"}};
const GR={g1:["tsu","nu"],g2:["ki","ke"],g3:["ta","ri"]},XR=[];
const addX=(k,t)=>t.trim().split("\n").forEach(l=>XR.push([k,...l.split("|")]));
addX("f",`ri|2|山に霞立て（り）。|り|文末なので終止形。「立て」は四段「立つ」の已然形(命令形)で、りに接続する。
ri|3|梅の咲け（り）枝を折る。|る|名詞「枝」に続くので連体形。
ri|4|雨降れ（り）ば、出でず。|れ|接続助詞「ば」(確定条件)の上なので已然形。
ri|0|花の咲け（り）ず。|ら|打消「ず」に続くので未然形。
nu|2|船、岸に着き（ぬ）。|ぬ|文末なので終止形。
nu|3|日暮れ（ぬ）ほどに、|ぬる|名詞「ほど」に続くので連体形。
nu|4|月こそ傾き（ぬ）。|ぬれ|係助詞「こそ」の結びなので已然形。
nu|0|花散り（ぬ）ば、惜しからむ。|な|仮定を表す「ば」の上は未然形。
tsu|3|文を書き（つ）人を見る。|つる|名詞「人」に続くので連体形。
tsu|4|鐘をこそ打ち（つ）。|つれ|係助詞「こそ」の結びなので已然形。
tsu|1|文を書き（つ）けり。|て|「けり」は連用形に接続するので連用形。
ki|3|昔、ここに住み（き）人あり。|し|名詞「人」に続くので連体形。
ki|4|雨降り（き）ば、出でず。|しか|確定条件の「ば」の上は已然形。
ki|0|世に桜のなかり（き）ば、心のどけからまし。|せ|「せば」の形で未然形(反実仮想)。
ke|3|雨の降り（けり）日、出でず。|ける|名詞「日」に続くので連体形。
ke|4|月こそ出で（けり）。|けれ|係助詞「こそ」の結びなので已然形。
ta|3|文を持ち（たり）人を見る。|たる|名詞「人」に続くので連体形。
ta|0|雪降り（たり）ば、出でじ。|たら|仮定を表す「ば」の上は未然形。
ta|3|雪ぞ降り（たり）。|たる|係助詞「ぞ」の結びなので連体形。`);
addX("v",`ri|3|風（吹く）る折、あはれなり。|吹け|吹か,吹き,吹く,吹け|「る」は「り」の連体形。「り」は四段動詞の已然形に接続するので「吹け」。
ri|2|つひに別れを（す）り。|せ|せ,し,す,する|「り」はサ変動詞の未然形に接続するので「せ」。
nu|2|船、岸に（着く）ぬ。|着き|着か,着き,着く,着け|「ぬ」は連用形に接続するので「着き」。
ki|3|昔ここに（住む）し人あり。|住み|住ま,住み,住む,住め|「き」は連用形に接続するので「住み」。
ke|2|月を（見る）けり。|見|見,見る,見れ,見よ|「けり」は連用形に接続。上一段「見る」の連用形は「見」。

  if(S.ans)return;S.ans=true;
  const q=S.list[S.i],ok=k===(q.x||q.m?q.ans:q.t),d=load();d.done++;if(ok)d.ok++;save(d);
  if(S.ph){ok?S.r2++:S.w2.push(q)}else{ok?S.first++:S.wrong.push(q)}
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.v===(q.x||q.m?q.ans:q.t))b.classList.add("ok");else if(b.dataset.v===k)b.classList.add("ng")});
  const last=S.i+1>=S.list.length,fb=document.getElementById("fb");
  fb.innerHTML=q.x?xFb(q,ok,last):`<div class="fb ${ok?"good":"bad"}"><strong>${ok?"○ 正解!":"× 不正解"}</strong>${q.m?`<p>「${q.w}」の${L[q.fi]}形${q.adj?(q.kari?"(カリ活用)":"(本活用)"):""}は <b>${q.ans}</b></p>`:`<p>${q.w}(${q.r})は <b>${T[q.t].n}</b></p>${q.k?`<p>「${q.w}」は${L[q.f]}形(カリ活用)です。</p>`:""}`}${cjHtml(q)}<p class="ex">${T[q.t].e}</p></div>
  <button class="go" data-a="next">${last?(!S.ph&&S.wrong.length?"復習へ進む":"結果を見る"):"次の問題"}</button>`;
  fb.scrollIntoView({behavior:"smooth",block:"end"});
 },
 next(){S.ans=false;S.i++;if(S.i<S.list.length)return quiz();if(!S.ph&&S.wrong.length)return mid();finish()}
